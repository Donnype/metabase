name: Validate OpenAPI

# Lints the generated OpenAPI document and checks that the spec committed under
# frontend/build/openapi/spec still matches what the Malli schemas produce, since that
# tree is what contributors generate their TS types from.
permissions:
  contents: read

on:
  push:
    branches:
      - 'master'
      - 'release-**'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  files-changed:
    name: Check which files changed
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 3
    outputs:
      openapi: ${{ steps.changes.outputs.openapi }}
      openapi_spec: ${{ steps.changes.outputs.openapi_spec }}
    steps:
      - uses: actions/checkout@v6
      - name: Test which files changed
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-paths.yaml

  validate-openapi:
    needs: files-changed
    if: needs.files-changed.outputs.openapi == 'true' || needs.files-changed.outputs.openapi_spec == 'true'
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 20
    steps:
      # No credentials: this job runs package.json scripts defined by the PR.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Prepare front-end environment
        uses: ./.github/actions/prepare-frontend
      - name: Prepare back-end environment
        uses: ./.github/actions/prepare-backend
      - name: Generate and split OpenAPI spec
        if: needs.files-changed.outputs.openapi_spec == 'true'
        run: bun run openapi:update

      - name: Generate OpenAPI spec
        if: needs.files-changed.outputs.openapi == 'true' && needs.files-changed.outputs.openapi_spec != 'true'
        run: bun run openapi:generate

      - name: Validate OpenAPI spec
        run: bun run openapi:lint

      # openapi:update above regenerates from source first, so any difference means the
      # commit did not include a regenerated spec. `git status` rather than `git diff`,
      # so that added and removed schema files count too.
      #
      # Warns rather than fails, on purpose. This is the first stage of rolling the check
      # out: it makes drift visible in the job summary without turning anyone's PR red,
      # so we can measure how often it fires before making it blocking.
      - name: Check the committed spec is up to date
        if: needs.files-changed.outputs.openapi_spec == 'true'
        run: |
          changes=$(git status --porcelain -uall frontend/build/openapi/spec)
          if [ -n "$changes" ]; then
            count=$(echo "$changes" | wc -l | tr -d ' ')
            echo "::warning::The committed OpenAPI spec is out of date ($count files). Run 'bun run openapi:update' and commit frontend/build/openapi/spec."
            {
              echo "### OpenAPI spec is out of date"
              echo
              echo "\`$count\` file(s) differ from what the current schemas produce."
              echo "Run \`bun run openapi:update\` and commit \`frontend/build/openapi/spec\`."
              echo
              echo '```'
              echo "$changes"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Committed OpenAPI spec is up to date." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Generate API types for type checking
        if: needs.files-changed.outputs.openapi_spec == 'true'
        run: bun run types:generate

      - name: Compile CLJS for type checking
        if: needs.files-changed.outputs.openapi_spec == 'true'
        run: bun run build-pure:cljs

      - name: Check frontend types
        if: needs.files-changed.outputs.openapi_spec == 'true'
        run: bun run type-check-pure

  # Aggregator: always runs, so it reports even when the work above is skipped. This is the
  # job to mark required once the freshness check above is promoted from warning to failure.
  openapi-result:
    # files-changed included so a failure there surfaces rather than skipping to success.
    needs: [files-changed, validate-openapi]
    if: always() && !cancelled()
    runs-on: ${{ vars.DEFAULT_RUNNER_KEY }}
    timeout-minutes: 5
    steps:
      - name: Check OpenAPI job status
        env:
          needs: ${{ toJson(needs) }}
        uses: actions/github-script@v9
        with:
          script: | # js
            const needs = JSON.parse(process.env.needs);
            const jobs = Object.entries(needs).map(([name, { result }]) => ({ name, result }));

            if (jobs.every(({ result }) => result === 'skipped' || result === 'success')) {
              console.log('All OpenAPI jobs are skipped or successful');
              process.exit(0);
            }

            console.log('Some OpenAPI jobs failed');
            jobs.filter(({ result }) => result !== 'success')
                .forEach(({ name, result }) => console.log(`${name} - ${result}`));
            process.exit(1);
